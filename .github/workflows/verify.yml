name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify public release contents
        run: npm run release:check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build production bundle
        run: npm run build

      - name: Exercise crash recovery in an isolated browser
        run: npm run test:browser
        env:
          CHROME_PATH: google-chrome

      - name: Check GitHub Pages paths and first-run experience
        run: npm run build -- --base=/tour-de-home/ && npm run test:release-browser
        env:
          CHROME_PATH: google-chrome
